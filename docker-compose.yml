version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cms_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  admin:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    container_name: cms_admin
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  public:
    build:
      context: ./public-frontend
      dockerfile: Dockerfile
    container_name: cms_public
    ports:
      - "3001:3001"
    depends_on:
      - backend
    restart: unless-stopped